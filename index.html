<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Você, Meu Amor 💙</title>
<style>
  :root {
    --primary: #0284c7;
    --card-bg: rgba(255, 255, 255, 0.12);
    --card-border: rgba(255, 255, 255, 0.2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  /* Fundo Azul Elegante */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(140deg, #0ea5e9 0%, #0369a1 50%, #082f49 100%);
    color: #ffffff;
    min-height: 100vh;
    padding-bottom: 60px;
    overflow-x: hidden;
    position: relative;
  }

  /* Corações Flutuantes no Fundo */
  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .hearts span {
    position: absolute; bottom: -50px; opacity: 0.4;
    animation: floatUp linear infinite; font-size: 20px;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-110vh) scale(1.2) rotate(360deg); opacity: 0; }
  }

  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 40px 20px; }
  
  /* Cabeçalho */
  .hero { text-align: center; margin-bottom: 48px; padding: 20px 0; }
  .hero-icon { font-size: 42px; margin-bottom: 12px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
  .hero h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
  .hero p { margin-top: 10px; color: rgba(255,255,255,0.85); font-size: 16px; font-weight: 500; }

  /* Seções */
  .section { margin-bottom: 40px; }
  .section h2 {
    font-size: 18px; font-weight: 600; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 1px;
    border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px;
  }

  /* Efeito de Vidro (Glassmorphism) para Cards */
  .glass {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
  }

  /* Textos / Mensagens */
  .msg-card { padding: 18px; margin-bottom: 12px; }
  .msg-card p { font-size: 16px; line-height: 1.6; }
  .msg-card .autor { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 600; text-align: right; }

  /* Fotos Organizadas */
  .fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fotos figure { overflow: hidden; border-radius: 16px; padding: 6px; }
  .fotos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block; }
  .fotos figcaption { padding: 8px; font-size: 13px; color: rgba(255,255,255,0.9); text-align: center; }

  /* Vídeos Organizados */
  .videos { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .video-box { padding: 6px; border-radius: 16px; }
  .video-box video { width: 100%; display: block; border-radius: 12px; }
  .video-box .leg { padding: 12px 10px 6px; font-size: 14px; text-align: center; color: rgba(255,255,255,0.9); }

  /* ENVELOPES INTERATIVOS (Cartinhas) */
  .envelope {
    display: flex; align-items: center; gap: 16px; padding: 20px;
    margin-bottom: 12px; cursor: pointer; transition: all 0.3s ease;
  }
  .envelope:hover { transform: translateY(-3px); background: rgba(255,255,255,0.2); }
  .env-icon { font-size: 36px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
  .env-text { flex: 1; }
  .env-text h4 { font-size: 16px; margin-bottom: 4px; font-weight: 600; }
  .env-text p { font-size: 13px; color: rgba(255,255,255,0.7); }

  /* MODAL DA CARTINHA */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .modal.active { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: #ffffff; color: #0f172a; border-radius: 20px; max-width: 420px; width: 100%;
    padding: 40px 24px 32px; position: relative; text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3); transform: translateY(20px); transition: transform 0.3s ease;
  }
  .modal.active .modal-content { transform: translateY(0); }
  .modal-content::before { content: "💌"; font-size: 48px; position: absolute; top: -24px; left: calc(50% - 24px); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
  .fechar { position: absolute; top: 12px; right: 16px; font-size: 24px; color: #94a3b8; cursor: pointer; background: none; border: none; padding: 4px; }
  #modalTexto { font-size: 17px; line-height: 1.7; font-family: "Georgia", serif; font-style: italic; color: #334155; margin-bottom: 24px; white-space: pre-wrap; text-align: left; }
  #modalAutor { font-size: 15px; font-weight: 700; color: var(--primary); text-align: right; }

  audio { width: 100%; border-radius: 12px; outline: none; }
  .empty { color: rgba(255,255,255,0.6); font-size: 14px; font-style: italic; text-align: center; padding: 12px; }
  footer { text-align: center; margin-top: 60px; color: rgba(255,255,255,0.5); font-size: 13px; }
  
  .loader { display:flex; justify-content:center; padding: 40px 0; }
  .loader div { width:32px; height:32px; border:3px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Corações no fundo -->
<div class="hearts" id="hearts"></div>

<div class="wrap">
  <div class="hero">
    <div class="hero-icon">🪷💙</div>
    <h1 id="titulo">Para Você, Meu Amor</h1>
    <p id="subtitulo">Nosso cantinho organizado e perfeito</p>
  </div>

  <div class="loader" id="loader"><div></div></div>

  <section class="section">
    <h2>🎵 Nossa Música</h2>
    <div id="musica" class="glass" style="padding:12px;"></div>
  </section>

  <section class="section">
    <h2>💌 Cartinhas Escondidas</h2>
    <div id="cartinhas"></div>
  </section>

  <section class="section">
    <h2>✨ Mensagens</h2>
    <div id="mensagens"></div>
  </section>

  <section class="section">
    <h2>📸 Nossos Momentos</h2>
    <div class="fotos" id="fotos"></div>
  </section>

  <section class="section">
    <h2>🎬 Vídeos</h2>
    <div class="videos" id="videos"></div>
  </section>

  <footer>Feito com 💙, chique e organizado.</footer>
</div>

<!-- O Pop-up da Cartinha -->
<div class="modal" id="modalCarta">
  <div class="modal-content">
    <button class="fechar" onclick="fecharCarta()">×</button>
    <div id="modalTexto"></div>
    <div id="modalAutor"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://dfizgbmpjwjzpubgvlkk.supabase.co"
const SUPABASE_KEY = "sb_publishable_UGbIT4vZW0jnc_7HMF8h8g_wrX1No9n"
const H = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }

// Gerador de corações azuis e lírios flutuantes
const hb = document.getElementById("hearts");
const emjs = ["💙", "🤍", "🪷", "✨"];
for (let i=0; i<20; i++){
  const s = document.createElement("span");
  s.textContent = emjs[Math.floor(Math.random() * emjs.length)];
  s.style.left = Math.random() * 100 + "%";
  s.style.fontSize = (14 + Math.random() * 18) + "px";
  s.style.animationDuration = (10 + Math.random() * 15) + "s";
  s.style.animationDelay = (Math.random() * 10) + "s";
  hb.appendChild(s);
}

// Armazena as cartinhas para abrir no modal
let cartasSalvas = [];

async function list(table){
  const r = await fetch(SUPABASE_URL+"/rest/v1/"+table+"?order=created_at.desc",{headers:H})
  if(!r.ok) throw new Error(await r.text())
  return r.json()
}
async function getConfig(){
  const r = await fetch(SUPABASE_URL+"/rest/v1/configuracoes?select=chave,valor",{headers:H})
  if(!r.ok) return {}
  const rows = await r.json(); const c={}; rows.forEach(x=>c[x.chave]=x.valor); return c
}

(async () => {
  try{
    const [cfg,msg,ft,vd,ct] = await Promise.all([getConfig().catch(()=>({})),list("mensagens").catch(()=>[]),list("fotos").catch(()=>[]),list("videos").catch(()=>[]),list("cartinhas").catch(()=>[])])
    if(cfg.titulo) document.getElementById("titulo").textContent = cfg.titulo
    if(cfg.subtitulo) document.getElementById("subtitulo").textContent = cfg.subtitulo

    const m = document.getElementById("musica")
    if(cfg.musica_url){ m.innerHTML = '<audio controls src="'+cfg.musica_url+'"></audio>' }
    else m.innerHTML = '<p class="empty" style="padding:0">Nenhuma música configurada.</p>'

    const ctEl = document.getElementById("cartinhas");
    cartasSalvas = ct;
    if(ct.length > 0) {
      ctEl.innerHTML = ct.map((x, i) => `
        <div class="envelope glass" onclick="abrirCarta(${i})">
          <div class="env-icon">💌</div>
          <div class="env-text">
            <h4>Carta Fechada</h4>
            <p>Toque para abrir e ler...</p>
          </div>
        </div>
      `).join('');
    } else {
      ctEl.innerHTML = '<p class="empty">Nenhuma carta escondida ainda.</p>';
    }

    const msgEl = document.getElementById("mensagens")
    msgEl.innerHTML = msg.length? msg.map(x=>'<div class="msg-card glass"><p>'+esc(x.texto)+'</p>'+(x.autor?'<div class="autor">— '+esc(x.autor)+'</div>':'')+'</div>').join('') : '<p class="empty">Nenhuma mensagem ainda.</p>'

    const ftEl = document.getElementById("fotos")
    ftEl.innerHTML = ft.length? ft.map(x=>'<figure class="glass"><img src="'+x.url+'" alt=""><figcaption>'+esc(x.legenda||'')+'</figcaption></figure>').join('') : '<p class="empty" style="grid-column:span 2">Nenhuma foto ainda.</p>'

    const vdEl = document.getElementById("videos")
    vdEl.innerHTML = vd.length? vd.map(x=>'<div class="video-box glass"><video controls src="'+x.url+'" preload="metadata"></video><div class="leg">'+esc(x.legenda||'')+'</div></div>').join('') : '<p class="empty">Nenhum vídeo ainda.</p>'

  }catch(e){
    document.getElementById("loader").innerHTML = '<p class="empty">'+e.message+'</p>'
  }finally{
    document.getElementById("loader").style.display="none"
  }
})();

function abrirCarta(index) {
  const c = cartasSalvas[index];
  document.getElementById("modalTexto").textContent = c.texto;
  document.getElementById("modalAutor").textContent = c.autor ? "Com amor, " + c.autor : "";
  document.getElementById("modalCarta").classList.add("active");
}
function fecharCarta() {
  document.getElementById("modalCarta").classList.remove("active");
}

function esc(s){ return (s||"").replace(/[<>&]/g, c=>({"<":"<",">":">","&":"&"}[c])) }
</script>
</body>
</html>
