<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Você, Meu Amor 💙</title>
<style>
  :root {
    --primary: #0284c7;
    --card-bg: rgba(255, 255, 255, 0.1);
    --card-border: rgba(255, 255, 255, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(140deg, #082f49 0%, #0369a1 50%, #0ea5e9 100%);
    color: #ffffff;
    min-height: 100vh;
    padding-bottom: 60px;
    overflow-x: hidden;
    position: relative;
  }

  /* Corações Flutuantes */
  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .hearts span {
    position: absolute; bottom: -50px; opacity: 0.3;
    animation: floatUp linear infinite; font-size: 18px;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-110vh) scale(1.2) rotate(360deg); opacity: 0; }
  }

  .wrap { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 30px 16px; }
  
  /* Header */
  .hero { text-align: center; margin-bottom: 32px; padding: 10px 0; }
  .hero-icon { font-size: 38px; margin-bottom: 8px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
  .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .hero p { margin-top: 6px; color: rgba(255,255,255,0.8); font-size: 14px; }

  /* Seções Estilo Netflix */
  .section { margin-bottom: 30px; }
  .section h2 {
    font-size: 16px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px;
    padding-left: 4px; color: #e0f2fe;
  }

  /* Carrossel Horizontal (Estilo Netflix) */
  .netflix-row {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 8px;
    scrollbar-width: none; /* Firefox */
  }
  .netflix-row::-webkit-scrollbar { display: none; } /* Chrome/Safari */

  /* Efeito de Vidro */
  .glass {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  }

  /* Cards de Fotos no Carrossel */
  .net-card-foto {
    flex: 0 0 170px;
    scroll-snap-align: start;
    overflow: hidden;
    padding: 6px;
    border-radius: 24px;
  }
  .net-card-foto img {
    width: 100%; height: 170px; object-fit: cover; border-radius: 18px; display: block;
  }
  .net-card-foto .leg {
    padding: 8px 4px 4px; font-size: 12px; text-align: center; color: rgba(255,255,255,0.9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Cards de Vídeos no Carrossel */
  .net-card-video {
    flex: 0 0 240px;
    scroll-snap-align: start;
    overflow: hidden;
    padding: 6px;
    border-radius: 24px;
  }
  .net-card-video video {
    width: 100%; height: 140px; object-fit: cover; border-radius: 18px; display: block;
  }
  .net-card-video .leg {
    padding: 8px 4px 4px; font-size: 12px; text-align: center; color: rgba(255,255,255,0.9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Cartinhas e Mensagens em Linha */
  .envelope {
    display: flex; align-items: center; gap: 14px; padding: 16px 20px;
    margin-bottom: 10px; cursor: pointer; transition: transform 0.2s;
    border-radius: 22px;
  }
  .envelope:active { transform: scale(0.98); }
  .env-icon { font-size: 30px; }
  .env-text h4 { font-size: 15px; margin-bottom: 2px; font-weight: 600; }
  .env-text p { font-size: 12px; color: rgba(255,255,255,0.7); }

  .msg-card { padding: 16px 20px; margin-bottom: 10px; border-radius: 22px; }
  .msg-card p { font-size: 14px; line-height: 1.5; }
  .msg-card .autor { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 600; text-align: right; }

  /* Modal da Cartinha */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .modal.active { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: #ffffff; color: #0f172a; border-radius: 28px; max-width: 380px; width: 100%;
    padding: 36px 20px 24px; position: relative; text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3); transform: translateY(15px); transition: transform 0.3s ease;
  }
  .modal.active .modal-content { transform: translateY(0); }
  .modal-content::before { content: "💌"; font-size: 42px; position: absolute; top: -22px; left: calc(50% - 21px); }
  .fechar { position: absolute; top: 12px; right: 16px; font-size: 24px; color: #94a3b8; cursor: pointer; background: none; border: none; }
  #modalTexto { font-size: 16px; line-height: 1.6; font-family: "Georgia", serif; font-style: italic; color: #334155; margin-bottom: 20px; white-space: pre-wrap; text-align: left; }
  #modalAutor { font-size: 14px; font-weight: 700; color: var(--primary); text-align: right; }

  audio { width: 100%; border-radius: 100px; outline: none; }
  .empty { color: rgba(255,255,255,0.6); font-size: 13px; font-style: italic; padding: 10px; }
  footer { text-align: center; margin-top: 40px; color: rgba(255,255,255,0.4); font-size: 12px; }
  
  .loader { display:flex; justify-content:center; padding: 30px 0; }
  .loader div { width:28px; height:28px; border:3px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="wrap">
  <div class="hero">
    <div class="hero-icon">🪷💙</div>
    <h1 id="titulo">Para Você, Meu Amor</h1>
    <p id="subtitulo">Nosso catálogo especial</p>
  </div>

  <div class="loader" id="loader"><div></div></div>

  <section class="section">
    <h2>🎵 Trilha Sonora</h2>
    <div id="musica" class="glass" style="padding:10px;"></div>
  </section>

  <section class="section">
    <h2>💌 Cartinhas</h2>
    <div id="cartinhas"></div>
  </section>

  <section class="section">
    <h2>✨ Mensagens</h2>
    <div id="mensagens"></div>
  </section>

  <section class="section">
    <h2>📸 Nossos Momentos (Arraste →)</h2>
    <div class="netflix-row" id="fotos"></div>
  </section>

  <section class="section">
    <h2>🎬 Vídeos (Arraste →)</h2>
    <div class="netflix-row" id="videos"></div>
  </section>

  <footer>Feito com 💙 e exclusividade.</footer>
</div>

<div class="modal" id="modalCarta">
  <div class="modal-content">
    <button class="fechar" onclick="fecharCarta()">×</button>
    <div id="modalTexto"></div>
    <div id="modalAutor"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://dfizgbmpjwjzpubgvlkk.supabase.co"
const SUPABASE_KEY = "sb_publishable_UGbIT4vZW0jnc_7HMF8h8g_wrX1No9n"
const H = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" }

const hb = document.getElementById("hearts");
const emjs = ["💙", "🤍", "🪷", "✨"];
for (let i=0; i<15; i++){
  const s = document.createElement("span");
  s.textContent = emjs[Math.floor(Math.random() * emjs.length)];
  s.style.left = Math.random() * 100 + "%";
  s.style.fontSize = (12 + Math.random() * 16) + "px";
  s.style.animationDuration = (10 + Math.random() * 12) + "s";
  s.style.animationDelay = (Math.random() * 8) + "s";
  hb.appendChild(s);
}

let cartasSalvas = [];

async function list(table){
  const r = await fetch(SUPABASE_URL+"/rest/v1/"+table+"?order=created_at.desc",{headers:H})
  if(!r.ok) throw new Error(await r.text())
  return r.json()
}
async function getConfig(){
  const r = await fetch(SUPABASE_URL+"/rest/v1/configuracoes?select=chave,valor",{headers:H})
  if(!r.ok) return {}
  const rows = await r.json(); const c={}; rows.forEach(x=>c[x.chave]=x.valor); return c
}

(async () => {
  try{
    const [cfg,msg,ft,vd,ct] = await Promise.all([getConfig().catch(()=>({})),list("mensagens").catch(()=>[]),list("fotos").catch(()=>[]),list("videos").catch(()=>[]),list("cartinhas").catch(()=>[])])
    if(cfg.titulo) document.getElementById("titulo").textContent = cfg.titulo
    if(cfg.subtitulo) document.getElementById("subtitulo").textContent = cfg.subtitulo

    const m = document.getElementById("musica")
    if(cfg.musica_url){ m.innerHTML = '<audio controls src="'+cfg.musica_url+'"></audio>' }
    else m.innerHTML = '<p class="empty" style="padding:0">Nenhuma música configurada.</p>'

    const ctEl = document.getElementById("cartinhas");
    cartasSalvas = ct;
    if(ct.length > 0) {
      ctEl.innerHTML = ct.map((x, i) => `
        <div class="envelope glass" onclick="abrirCarta(${i})">
          <div class="env-icon">💌</div>
          <div class="env-text">
            <h4>Toque para abrir a carta</h4>
            <p>Mensagem secreta exclusiva</p>
          </div>
        </div>
      `).join('');
    } else {
      ctEl.innerHTML = '<p class="empty">Nenhuma carta escondida.</p>';
    }

    const msgEl = document.getElementById("mensagens")
    msgEl.innerHTML = msg.length? msg.map(x=>'<div class="msg-card glass"><p>'+esc(x.texto)+'</p>'+(x.autor?'<div class="autor">— '+esc(x.autor)+'</div>':'')+'</div>').join('') : '<p class="empty">Nenhuma mensagem.</p>'

    const ftEl = document.getElementById("fotos")
    ftEl.innerHTML = ft.length? ft.map(x=>'<div class="net-card-foto glass"><img src="'+x.url+'" alt=""><div class="leg">'+esc(x.legenda||'Momento')+'</div></div>').join('') : '<p class="empty">Nenhuma foto.</p>'

    const vdEl = document.getElementById("videos")
    vdEl.innerHTML = vd.length? vd.map(x=>'<div class="net-card-video glass"><video controls src="'+x.url+'" preload="metadata"></video><div class="leg">'+esc(x.legenda||'Vídeo')+'</div></div>').join('') : '<p class="empty">Nenhum vídeo.</p>'

  }catch(e){
    document.getElementById("loader").innerHTML = '<p class="empty">'+e.message+'</p>'
  }finally{
    document.getElementById("loader").style.display="none"
  }
})();

function abrirCarta(index) {
  const c = cartasSalvas[index];
  document.getElementById("modalTexto").textContent = c.texto;
  document.getElementById("modalAutor").textContent = c.autor ? "Com amor, " + c.autor : "";
  document.getElementById("modalCarta").classList.add("active");
}
function fecharCarta() {
  document.getElementById("modalCarta").classList.remove("active");
}

function esc(s){ return (s||"").replace(/[<>&]/g, c=>({"<":"<",">":">","&":"&"}[c])) }
</script>
</body>
</html>
